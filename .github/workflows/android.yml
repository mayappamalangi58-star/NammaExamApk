name: Build Namma Exam APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and build
        run: |
          unzip -q NammaExam_Android_Studio_Project.zip -d extracted
          cd extracted/NammaExamAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: NammaExam-APK
          path: extracted/NammaExamAndroid/app/build/outputs/apk/debug/app-debug.apk
